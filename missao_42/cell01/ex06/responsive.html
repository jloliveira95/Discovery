<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Responsiva</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            box-sizing: border-box;
        }

        .tabela-cheia {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .celula{
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 20px;

        }
    </style>
</head>
<body>
   <div class="tabela-cheia">
        <div class="celula" style="background-color: lightblue;">
            PRIMEIRA CELULA
        </div>
        <div class="celula" style="background-color: lightgreen;">
            SEGUNDA CELULA
        </div>

   </div>
</body>
</html>
